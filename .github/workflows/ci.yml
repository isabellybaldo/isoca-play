name: ci

# Also called by release.yml, so a release runs the same checks. No secrets here.
# web/e2e/offline.mjs stays a manual run: on Linux it was not steady enough to gate a release.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks, whole history
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/scan:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /scan --redact --log-opts=--all

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: web, tests and build (build runs tsc)
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: server tests, the image test among them
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m pytest -q
