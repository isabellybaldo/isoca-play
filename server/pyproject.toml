[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isoca-play"
version = "0.1.0"
description = "Private sudoku and mahjong site: the service behind web/"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "argon2-cffi"]

[project.scripts]
isoca-play = "isoca_play.cli:main"

[tool.setuptools]
packages = ["isoca_play"]

[tool.setuptools.package-data]
isoca_play = ["public/*", "public/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
